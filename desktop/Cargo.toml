[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hostname = "0.3"
qrcode = "0.13"
reqwest = { version = "0.12", features = ["blocking", "json"] }
get_if_addrs = "0.5"
portable-pty = "0.8"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
scrap = "0.5"
enigo = "0.1"
flate2 = "1"
rfb-encodings = "0.1"
jpeg-encoder = { version = "0.7", default-features = true }
directories = "5"
sha2 = "0.10"
vt100 = "0.16.2"
quinn = "0.11"
rcgen = "0.12"
rustls = "0.23"
bytes = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc2 = "0.6"
objc2-core-wlan = { version = "0.3", features = ["CWWiFiClient", "CWInterface"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(x11)"] }

[patch.crates-io]
scrap = { path = "vendor/scrap" }
