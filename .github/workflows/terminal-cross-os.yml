name: Terminal Cross-OS Guardrails

on:
  pull_request:
    paths:
      - desktop/src/terminal.rs
      - desktop/src/terminal_core.rs
      - desktop/src/bin/terminald.rs
      - desktop/src/bin/vibe-ctl.rs
      - desktop/src/terminald_launcher.rs
      - desktop/frontend/index.html
      - .github/workflows/terminal-cross-os.yml
  push:
    branches:
      - main
      - master
    paths:
      - desktop/src/terminal.rs
      - desktop/src/terminal_core.rs
      - desktop/src/bin/terminald.rs
      - desktop/src/bin/vibe-ctl.rs
      - desktop/src/terminald_launcher.rs
      - desktop/frontend/index.html
      - .github/workflows/terminal-cross-os.yml
  workflow_dispatch:

jobs:
  terminal-guardrails:
    name: Terminal guardrails (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop -> target
            third_party/rustdesk -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            cmake \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxtst-dev

      - name: Terminal runtime guardrail tests
        run: |
          cargo test terminal_core::tests::login_args_match_platform_shell_expectations --lib
          cargo test terminal_core::tests::login_args_disabled_for_non_login_shells --lib
          cargo test terminal_core::tests::utf8_locale_detector_matches_common_values --lib
          cargo test terminal::tests::should_not_autostart_on_version_mismatch --lib
          cargo test terminal::tests::block_on_terminal_future_inside_runtime_does_not_panic --lib

      - name: Terminal binaries compile
        run: |
          cargo check --bin terminald
          cargo check --bin vibe-ctl
